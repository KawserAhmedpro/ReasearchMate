<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ResearchMate V1.2 — PDF Export Verification</title>
  <link rel="stylesheet" href="../css/vendor/katex.min.css">
  <script src="../js/vendor/jszip.min.js"></script>
  <script src="../js/vendor/quill.js"></script>
  <script src="../js/vendor/katex.min.js"></script>
  <script src="../js/vendor/katex-svg-style.js"></script>
  <script src="../js/vendor/pdfmake.min.js"></script>
  <script src="../js/vendor/pdf-fonts.js"></script>
  <script src="../js/database.js"></script>
  <script src="../js/rich-editor.js"></script>
  <script src="../js/pdf-export.js"></script>
</head>
<body>
  <h1>ResearchMate V1.2 — Professional PDF Export Test</h1>
  <div id="status">Generating multi-page V1.2 PDF...</div>

  <script>
    async function createDiagramBlob(mimeType, width, height, titleText, accentColor) {
      const c = document.createElement('canvas');
      c.width = width;
      c.height = height;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, width, height);
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 3;
      ctx.strokeRect(4, 4, width - 8, height - 8);

      // Draw a mock academic architecture diagram
      ctx.fillStyle = accentColor;
      ctx.fillRect(28, 36, 130, 56);
      ctx.fillRect(198, 36, 130, 56);
      ctx.fillRect(368, 36, 130, 56);

      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(158, 64); ctx.lineTo(198, 64);
      ctx.moveTo(328, 64); ctx.lineTo(368, 64);
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 14px sans-serif';
      ctx.fillText('Encoder', 62, 69);
      ctx.fillText('Attention', 230, 69);
      ctx.fillText('Decoder', 402, 69);

      ctx.fillStyle = '#0f172a';
      ctx.font = '13px sans-serif';
      ctx.fillText(titleText, 28, height - 20);

      return new Promise(res => c.toBlob(res, mimeType, 0.92));
    }

    async function runPdfVerification() {
      const statusEl = document.getElementById('status');
      try {
        await window.ResearchMateDB.initDB();

        const paper = await window.ResearchMateDB.addPaper({
          title: 'Attention Is All You Need — বাংলা গবেষণা নোট (V1.2)',
          authors: 'Ashish Vaswani, Noam Shazeer, Niki Parmar, Jakob Uszkoreit et al.',
          year: 2017,
          doiUrl: 'https://arxiv.org/abs/1706.03762'
        });

        const pngBlob = await createDiagramBlob('image/png', 520, 140, 'Figure A: Transformer Pipeline (PNG)', '#1d4ed8');
        const webpBlob = await createDiagramBlob('image/webp', 520, 140, 'Figure B: Attention Heatmap Diagram (WEBP -> PNG)', '#0f766e');

        const savedPng = await window.ResearchMateDB.saveNoteImage(paper.id, 'methodology', pngBlob, {
          fileName: 'transformer_arch.png',
          fileType: 'image/png',
          width: 520,
          height: 140
        });
        const savedWebp = await window.ResearchMateDB.saveNoteImage(paper.id, 'evaluationProtocol', webpBlob, {
          fileName: 'ablation_plot.webp',
          fileType: 'image/webp',
          width: 520,
          height: 140
        });

        const largeComparisonRows = [
          ['Model Variant (মডেল)', 'EN-DE BLEU', 'Training Cost (FLOPs)', 'Key Notes / পর্যবেক্ষণ']
        ];
        for (let i = 1; i <= 28; i++) {
          largeComparisonRows.push([
            `Experiment Row <b>#${i}</b>`,
            `${(25.0 + i * 0.14).toFixed(2)}`,
            `<code>${(i * 1.1).toFixed(1)}e19</code>`,
            `Evaluation entry #${i} — বাংলা ও ইংরেজি মিশ্র বিশ্লেষণ ও যুক্তাক্ষর (প্রক্রিয়াকরণ, বিজ্ঞান)।`
          ]);
        }

        const notes = await window.ResearchMateDB.saveNotes({
          paperId: paper.id,
          researchProblem: {
            format: 'quill-delta-v1',
            delta: {
              ops: [
                { insert: 'Sequential Recurrence Bottleneck' },
                { insert: '\n', attributes: { header: 1 } },
                { insert: 'Standard RNN/LSTM models prevent parallelization within training examples because hidden state ' },
                { insert: 'h_t', attributes: { code: true } },
                { insert: ' depends sequentially on ' },
                { insert: 'h_{t-1}', attributes: { code: true } },
                { insert: '. গবেষণা সমস্যা: যুক্তাক্ষর যেমন ক্ষ, জ্ঞ, ত্ত, ন্ত, র্ষ, স্ত্র এবং বিজ্ঞান। ' },
                { insert: 'Bold highlighted point', attributes: { bold: true } },
                { insert: ' and ' },
                { insert: 'italic emphasis', attributes: { italic: true } },
                { insert: '.\n' },
                { insert: 'Key observation quote: Attention draws global dependencies regardless of distance.', attributes: { blockquote: true } },
                { insert: '\n', attributes: { blockquote: true } },
                { insert: 'Read original paper: ' },
                { insert: 'arXiv:1706.03762', attributes: { link: 'https://arxiv.org/abs/1706.03762' } },
                { insert: '\n' },
                { insert: { hr: true } }
              ]
            }
          },
          researchObjective: 'Replace recurrence entirely with Multi-Head Self-Attention mechanisms.',
          dataset: {
            format: 'quill-delta-v1',
            delta: {
              ops: [
                { insert: 'WMT 2014 Benchmarks' },
                { insert: '\n', attributes: { header: 2 } },
                { insert: 'English-German: ~4.5M sentence pairs (BPE ~37k tokens).' },
                { insert: '\n', attributes: { list: 'bullet' } },
                { insert: 'English-French: ~36M sentence pairs (32k word-piece vocab).' },
                { insert: '\n', attributes: { list: 'bullet' } }
              ]
            }
          },
          methodology: {
            format: 'quill-delta-v1',
            delta: {
              ops: [
                { insert: '1. Scaled Dot-Product Attention combines queries and keys with inline factor ' },
                { insert: { 'math-equation': { latex: 'd_k = 64,\\; E = mc^2 + \\sqrt{a^2 + b^2}', displayMode: false } } },
                { insert: ' as shown below:\n' },
                {
                  insert: {
                    'research-image': {
                      imageId: savedPng.id,
                      widthPct: 85,
                      align: 'center',
                      caption: 'Fig. 1: End-to-End Transformer Pipeline (PNG Diagram)',
                      source: 'Vaswani et al. (2017), Figure 1',
                      fileName: 'transformer_arch.png'
                    }
                  }
                },
                { insert: '2. Regularized Objective Loss Function:\n' },
                {
                  insert: {
                    'math-equation': {
                      latex: '\\mathcal{L}(\\theta) = -\\sum_{i=1}^{N} y_i \\log(\\hat{y}_i) + \\frac{\\lambda}{2}\\|\\theta\\|_2^2',
                      displayMode: true
                    }
                  }
                },
                { insert: '\n3. Encoder & Decoder stack explanation preserving exact insertion order.\n' },
                { insert: 'def attention(Q, K, V):' },
                { insert: '\n', attributes: { 'code-block': true } },
                { insert: '    return softmax(Q @ K.T / sqrt(d_k)) @ V' },
                { insert: '\n', attributes: { 'code-block': true } }
              ]
            }
          },
          evaluationProtocol: {
            format: 'quill-delta-v1',
            delta: {
              ops: [
                { insert: 'Trained for 3.5 days on 8 NVIDIA P100 GPUs using Adam optimizer with warmup steps = 4000.\n' },
                {
                  insert: {
                    'research-image': {
                      imageId: savedWebp.id,
                      widthPct: 75,
                      align: 'center',
                      caption: 'Fig. 2: Hyperparameter Ablation Summary (WEBP converted to PNG)',
                      source: 'Author Ablation Table 3',
                      fileName: 'ablation_plot.webp'
                    }
                  }
                }
              ]
            }
          },
          evaluationMetrics: {
            format: 'quill-delta-v1',
            delta: {
              ops: [
                { insert: 'BLEU comparison across architectural variants (multi-page repeating header table):\n' },
                {
                  insert: {
                    'research-table': {
                      hasHeader: true,
                      rows: largeComparisonRows
                    }
                  }
                }
              ]
            }
          },
          keyFindings: 'Transformer (big) achieved 28.4 BLEU on EN-DE and 41.8 BLEU on EN-FR at a fraction of prior compute cost.',
          limitations: 'Self-attention scales quadratically with sequence length O(n^2 · d), constraining long-context inputs.',
          futureWork: 'Apply attention models to images, audio, video, and local sparse attention patterns.',
          criticalAnalysis: 'Seminal architecture that unified NLP and multimodal representation learning. ব্যক্তিগত বিশ্লেষণ।'
        });

        const pdfRes = await window.PDFExporter.exportPaperNotesAsPDF(paper, notes, { download: false });
        if (!pdfRes || !(pdfRes.blob instanceof Blob) || pdfRes.blob.size < 15000) {
          throw new Error('Generated PDF blob invalid or unexpectedly small');
        }
        const header = new TextDecoder().decode(await pdfRes.blob.slice(0, 5).arrayBuffer());
        if (!header.startsWith('%PDF')) {
          throw new Error('Invalid PDF header: ' + header);
        }

        const base64Pdf = await new Promise((resolve) => {
          const r = new FileReader();
          r.onload = () => resolve(r.result.split(',')[1]);
          r.readAsDataURL(pdfRes.blob);
        });

        await window.ResearchMateDB.deletePaper(paper.id);

        statusEl.textContent = `SUCCESS: ${pdfRes.filename} (${pdfRes.blob.size} bytes)`;
        window.__pdfTestResult = { status: 'SUCCESS', filename: pdfRes.filename, size: pdfRes.blob.size, base64Pdf };

        await fetch('/report_test_results', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            status: 'SUCCESS',
            filename: pdfRes.filename,
            pdfSize: pdfRes.blob.size,
            magic: header,
            base64Pdf
          })
        }).catch(() => {});
      } catch (e) {
        console.error(e);
        statusEl.textContent = 'ERROR: ' + e.message;
        window.__pdfTestResult = { status: 'ERROR', error: e.message };
        await fetch('/report_test_results', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'ERROR', error: e.message })
        }).catch(() => {});
      }
    }

    window.onload = runPdfVerification;
  </script>
</body>
</html>
