<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResearchMate V1.2 — Automated Core & PDF Tests</title>
  <link rel="stylesheet" href="../css/vendor/katex.min.css">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding: 20px; background: #f8fafc; color: #0f172a; }
    .log-line { margin: 4px 0; font-family: monospace; font-size: 13px; }
    .pass { color: #059669; font-weight: 600; }
    .fail { color: #dc2626; font-weight: 700; }
    .info { color: #2563eb; }
  </style>
  <script src="../js/vendor/jszip.min.js"></script>
  <script src="../js/vendor/quill.js"></script>
  <script src="../js/vendor/katex.min.js"></script>
  <script src="../js/vendor/katex-svg-style.js"></script>
  <script src="../js/vendor/pdfmake.min.js"></script>
  <script src="../js/vendor/pdf-fonts.js"></script>
  <script src="../js/database.js"></script>
  <script src="../js/rich-editor.js"></script>
  <script src="../js/pdf-export.js"></script>
</head>
<body>
  <h1>ResearchMate V1.2 — Automated Core &amp; PDF Test Suite</h1>
  <div id="logs"></div>

  <script>
    const results = [];
    function log(msg, type = 'INFO') {
      const div = document.createElement('div');
      div.className = 'log-line ' + (type === 'PASS' ? 'pass' : type === 'FAIL' ? 'fail' : 'info');
      div.textContent = `[${type}] ${msg}`;
      document.getElementById('logs').appendChild(div);
      results.push({ status: type, msg });
    }

    function assert(condition, msg) {
      if (!condition) {
        log(msg, 'FAIL');
        throw new Error('Assertion failed: ' + msg);
      }
      log(msg, 'PASS');
    }

    async function createCanvasImageBlob(mimeType, width, height, label) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#f1f5f9';
      ctx.fillRect(0, 0, width, height);
      ctx.fillStyle = '#1d4ed8';
      ctx.fillRect(10, 10, width - 20, height - 20);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 14px sans-serif';
      ctx.fillText(label || mimeType, 20, Math.round(height / 2));

      return new Promise((resolve, reject) => {
        canvas.toBlob((blob) => {
          if (!blob) return reject(new Error('Canvas toBlob failed for ' + mimeType));
          resolve(blob);
        }, mimeType, 0.92);
      });
    }

    async function seedLegacyV2Database() {
      // Clear any previous instance in fresh profile
      await new Promise((resolve, reject) => {
        const req = indexedDB.deleteDatabase('ResearchMateDB');
        req.onsuccess = resolve;
        req.onerror = () => reject(req.error);
        req.onblocked = resolve;
      });

      const dbV2 = await new Promise((resolve, reject) => {
        const req = indexedDB.open('ResearchMateDB', 2);
        req.onupgradeneeded = (event) => {
          const db = event.target.result;
          const pStore = db.createObjectStore('papers', { keyPath: 'id' });
          pStore.createIndex('createdAt', 'createdAt', { unique: false });
          db.createObjectStore('notes', { keyPath: 'paperId' });
          const pdfStore = db.createObjectStore('pdfs', { keyPath: 'paperId' });
          pdfStore.createIndex('createdAt', 'createdAt', { unique: false });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });

      await new Promise((resolve, reject) => {
        const tx = dbV2.transaction(['papers', 'notes'], 'readwrite');
        tx.objectStore('papers').put({
          id: 'legacy_v1_paper',
          title: 'Legacy V1 Paper (পূর্ববর্তী ডেটা)',
          authors: 'Legacy Author',
          year: 2021,
          doiUrl: 'https://example.org/legacy',
          hasPdf: false,
          createdAt: new Date().toISOString()
        });
        tx.objectStore('notes').put({
          paperId: 'legacy_v1_paper',
          researchProblem: 'Plain V1 text problem.\nবাংলা অনুচ্ছেদ অক্ষত থাকতে হবে।',
          researchObjective: '',
          dataset: '',
          methodology: 'CNN baseline model',
          evaluationProtocol: '',
          evaluationMetrics: '',
          keyFindings: '',
          limitations: '',
          futureWork: '',
          criticalAnalysis: '',
          updatedAt: new Date().toISOString()
        });
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });

      dbV2.close();
    }

    async function runTests() {
      try {
        log('Starting ResearchMate V1.2 automated test suite...');

        // Test 0: Seed V2 database & verify V2 -> V3 IndexedDB non-destructive migration
        await seedLegacyV2Database();
        const db = await window.ResearchMateDB.initDB();
        assert(db && db.version === 3, 'IndexedDB initialized at version 3');
        assert(db.objectStoreNames.contains('images'), 'V3 schema includes "images" object store');

        const migratedLegacyPaper = await window.ResearchMateDB.getPaperById('legacy_v1_paper');
        const migratedLegacyNotes = await window.ResearchMateDB.getNotesByPaperId('legacy_v1_paper');
        assert(migratedLegacyPaper !== null && migratedLegacyPaper.title.includes('পূর্ববর্তী ডেটা'), 'Legacy paper preserved across V2 -> V3 migration');
        assert(migratedLegacyNotes.researchProblem && migratedLegacyNotes.researchProblem.format === 'quill-delta-v1', 'Legacy plain-text section converted to quill-delta-v1');
        const migratedProblemText = window.ResearchMateDB.extractSectionPlainText(migratedLegacyNotes.researchProblem);
        assert(migratedProblemText.includes('Plain V1 text problem.') && migratedProblemText.includes('বাংলা অনুচ্ছেদ অক্ষত থাকতে হবে।'), 'Legacy multiline English + Bengali text preserved identically');
        assert(window.ResearchMateDB.calculateCompletion(migratedLegacyNotes).completedCount === 2, 'Migrated completion accurately counts 2/10 non-empty sections');
        await window.ResearchMateDB.deletePaper('legacy_v1_paper');

        // Test 1: Manual Paper Creation
        const paperManual = await window.ResearchMateDB.addPaper({
          title: 'Deep Residual Learning for Image Recognition',
          authors: 'Kaiming He, Xiangyu Zhang, Shaoqing Ren, Jian Sun',
          year: 2016,
          doiUrl: 'https://arxiv.org/abs/1512.03385'
        });
        assert(paperManual && paperManual.id, 'Manual paper created with unique ID');
        assert(paperManual.hasPdf === false, 'Manual paper has hasPdf: false');

        // Test 2: PDF Upload Paper Creation
        const fakePdfBlob = new Blob(['%PDF-1.4\n1 0 obj\n<< /Title (Attention Is All You Need) >>\nendobj\n%%EOF'], { type: 'application/pdf' });
        const fakePdfFile = new File([fakePdfBlob], 'attention_is_all_you_need.pdf', { type: 'application/pdf' });

        const paperWithPdf = await window.ResearchMateDB.addPaper({
          title: 'Attention Is All You Need (ট্রান্সফরমার গবেষণা)',
          authors: 'Ashish Vaswani et al.',
          year: 2017,
          doiUrl: 'https://arxiv.org/abs/1706.03762'
        }, fakePdfFile);

        assert(paperWithPdf && paperWithPdf.id, 'Paper with PDF created with unique ID');
        assert(paperWithPdf.hasPdf === true, 'Paper with PDF has hasPdf: true');
        assert(paperWithPdf.pdfFileName === 'attention_is_all_you_need.pdf', 'pdfFileName stored properly');

        // Test 3: Read Paper PDF from IndexedDB
        const storedPdfRecord = await window.ResearchMateDB.getPaperPdf(paperWithPdf.id);
        assert(storedPdfRecord && storedPdfRecord.fileBlob instanceof Blob, 'Retrieved PDF Blob from IndexedDB');
        assert(storedPdfRecord.fileBlob.size === fakePdfBlob.size, 'PDF Blob size matches uploaded file');

        // Test 4: Save & Retrieve Images (PNG & WEBP) in V3 'images' Store
        const pngBlob = await createCanvasImageBlob('image/png', 240, 140, 'Arch Diagram PNG');
        const webpBlob = await createCanvasImageBlob('image/webp', 200, 120, 'Ablation Plot WEBP');

        const savedPng = await window.ResearchMateDB.saveNoteImage(paperWithPdf.id, 'methodology', pngBlob, {
          fileName: 'architecture.png',
          fileType: 'image/png',
          width: 240,
          height: 140
        });
        const savedWebp = await window.ResearchMateDB.saveNoteImage(paperWithPdf.id, 'evaluationProtocol', webpBlob, {
          fileName: 'ablation.webp',
          fileType: 'image/webp',
          width: 200,
          height: 120
        });

        assert(savedPng && savedPng.id.startsWith('img_'), 'Saved PNG image record in images store');
        assert(savedWebp && savedWebp.id.startsWith('img_'), 'Saved WEBP image record in images store');
        const fetchedPng = await window.ResearchMateDB.getNoteImage(savedPng.id);
        assert(fetchedPng && fetchedPng.fileBlob instanceof Blob && fetchedPng.fileBlob.size === pngBlob.size, 'Retrieved PNG Blob intact from images store');
        const paperImages = await window.ResearchMateDB.getImagesByPaperId(paperWithPdf.id);
        assert(paperImages.length === 2, 'getImagesByPaperId returns both embedded images');

        // Test 5: Unified Rich Delta Save across all 10 sections (preserving order + no base64 in notes)
        const largeTableRows = [['Model / Baseline', 'BLEU (EN-DE)', 'Notes & মন্তব্য']];
        for (let i = 1; i <= 22; i++) {
          largeTableRows.push([`Baseline Variant <b>#${i}</b>`, `${(24.0 + i * 0.2).toFixed(1)}`, `Row ${i} — বিশ্লেষণ এবং <code>O(n^2)</code>`]);
        }

        const richNotesPayload = {
          paperId: paperWithPdf.id,
          researchProblem: {
            format: 'quill-delta-v1',
            delta: {
              ops: [
                { insert: 'Core Sequential Bottleneck' },
                { insert: '\n', attributes: { header: 2 } },
                { insert: 'Recurrent models process tokens sequentially (' },
                { insert: 'O(n)', attributes: { code: true } },
                { insert: '), preventing parallelization. ' },
                { insert: 'যুক্তাক্ষর যেমন ক্ষ, জ্ঞ, ত্ত, ন্ত, র্ষ, স্ত্র এবং বিজ্ঞান ও প্রক্রিয়াকরণ।', attributes: { bold: true } },
                { insert: '\n' },
                { insert: 'Reference arXiv Link', attributes: { link: 'https://arxiv.org/abs/1706.03762' } },
                { insert: '\n', attributes: { blockquote: true } },
                { insert: 'First bullet insight' },
                { insert: '\n', attributes: { list: 'bullet' } },
                { insert: 'Second numbered insight' },
                { insert: '\n', attributes: { list: 'ordered' } },
                { insert: { hr: true } }
              ]
            }
          },
          researchObjective: 'Design an attention-only sequence transduction model.\nEliminate recurrence completely.',
          dataset: {
            format: 'quill-delta-v1',
            delta: {
              ops: [
                { insert: 'WMT 2014 English-German (4.5M sentence pairs) & BPE vocab.\n' },
                { insert: 'def scaled_dot_product(q, k, v):\n    return softmax((q @ k.T) / sqrt(d_k)) @ v' },
                { insert: '\n', attributes: { 'code-block': true } }
              ]
            }
          },
          methodology: {
            format: 'quill-delta-v1',
            delta: {
              ops: [
                { insert: 'Multi-Head Self-Attention with inline equation ' },
                { insert: { 'math-equation': { latex: 'E = mc^2 + \\sqrt{a^2 + b^2}', displayMode: false } } },
                { insert: ' followed by the block diagram:\n' },
                {
                  insert: {
                    'research-image': {
                      imageId: savedPng.id,
                      widthPct: 70,
                      align: 'center',
                      caption: 'Fig. 1: Scaled Dot-Product & Multi-Head Attention (চিত্র ১)',
                      source: 'Vaswani et al. (2017), Section 3.2',
                      fileName: 'architecture.png'
                    }
                  }
                },
                { insert: { 'math-equation': { latex: '\\mathcal{L}(\\theta) = -\\sum_{i=1}^{N} y_i \\log(\\hat{y}_i) + \\frac{\\lambda}{2}\\|\\theta\\|_2^2', displayMode: true } } },
                { insert: '\nPost-equation explanation preserving exact order.\n' }
              ]
            }
          },
          // Image-only section MUST count as completed!
          evaluationProtocol: {
            format: 'quill-delta-v1',
            delta: {
              ops: [
                {
                  insert: {
                    'research-image': {
                      imageId: savedWebp.id,
                      widthPct: 60,
                      align: 'left',
                      caption: 'Fig. 2: WEBP Protocol Diagram',
                      source: 'Internal reproduction',
                      fileName: 'ablation.webp'
                    }
                  }
                }
              ]
            }
          },
          // Table-only section MUST count as completed!
          evaluationMetrics: {
            format: 'quill-delta-v1',
            delta: {
              ops: [
                {
                  insert: {
                    'research-table': {
                      hasHeader: true,
                      rows: largeTableRows
                    }
                  }
                }
              ]
            }
          },
          keyFindings: 'State-of-the-art 28.4 BLEU with 3.5 days on 8 P100 GPUs.',
          limitations: 'Quadratic attention memory complexity O(n^2) on very long sequences.',
          // Math-only section MUST count as completed!
          futureWork: {
            format: 'quill-delta-v1',
            delta: {
              ops: [
                { insert: { 'math-equation': { latex: '\\text{Attention}(Q,K,V) = \\text{softmax}\\left(\\frac{QK^T}{\\sqrt{d_k}}\\right)V', displayMode: true } } }
              ]
            }
          },
          criticalAnalysis: 'Foundational architecture powering modern language and multimodal models.'
        };

        const savedNotes = await window.ResearchMateDB.saveNotes(richNotesPayload);
        assert(savedNotes && savedNotes.paperId === paperWithPdf.id, 'saveNotes saved rich Delta notes cleanly');
        const notesSerialized = JSON.stringify(savedNotes);
        assert(!notesSerialized.includes('data:image/'), 'Saved notes JSON does NOT embed Base64 image payloads');

        // Test 6: Completion counts text, image-only, table-only, and math-only sections accurately
        const compStats = window.ResearchMateDB.calculateCompletion(savedNotes);
        assert(compStats.completedCount === 10 && compStats.isComplete === true, 'Completion counts rich text, image-only, table-only, and math-only sections (10/10)');

        // Test 7: Notes-Only JSON V2 Export
        const notesExport = await window.ResearchMateDB.exportNotesOnlyJson();
        assert(notesExport && notesExport.filename.endsWith('.json'), 'exportNotesOnlyJson returns .json file');
        const parsedNotesJson = JSON.parse(notesExport.jsonString);
        assert(parsedNotesJson.backupVersion === 2, 'Notes-only JSON reports backupVersion: 2');
        assert(Array.isArray(parsedNotesJson.imagesMetadata) && parsedNotesJson.imagesMetadata.length === 2, 'Notes-only JSON exports image reference metadata');
        const exportedPaperNote = parsedNotesJson.notes.find(n => n.paperId === paperWithPdf.id);
        assert(exportedPaperNote && exportedPaperNote.methodology.format === 'quill-delta-v1', 'Notes-only JSON preserves structured rich formatting');

        // Test 8: Full Backup V2 ZIP Export & Inspection
        let zipProgressCalled = false;
        const zipExport = await window.ResearchMateDB.exportFullBackupZip(() => { zipProgressCalled = true; });
        assert(zipExport && zipExport.blob && zipExport.blob.size > 0, 'exportFullBackupZip generated non-empty ZIP');
        assert(zipProgressCalled === true, 'ZIP export progress callback triggered');

        const validatedZip = await window.ResearchMateDB.inspectAndValidateZipBackup(zipExport.blob);
        assert(validatedZip.isValid === true && validatedZip.backupInfo.backupVersion === 2, 'Validated backup ZIP v2 metadata');
        assert(validatedZip.pdfCount === 1 && validatedZip.imageCount === 2, 'ZIP backup includes 1 original PDF and 2 embedded images');
        assert(validatedZip.missingImages.length === 0 && validatedZip.missingPdfs.length === 0, 'ZIP integrity check reports zero missing images or PDFs');

        // Test 9: Replace Mode Restore
        const tempExtra = await window.ResearchMateDB.addPaper({ title: 'Temporary Paper To Wipe', authors: 'Temp', year: 2024 });
        const replaceRes = await window.ResearchMateDB.restoreZipBackup(validatedZip, 'replace');
        assert(replaceRes.restoredPapers === 2 && replaceRes.restoredPdfs === 1 && replaceRes.restoredImages === 2, 'Replace mode restored 2 papers, 1 PDF, and 2 images');
        assert((await window.ResearchMateDB.getPaperById(tempExtra.id)) === null, 'Replace mode erased pre-existing extra paper');
        const restoredPng = await window.ResearchMateDB.getNoteImage(savedPng.id);
        const restoredWebp = await window.ResearchMateDB.getNoteImage(savedWebp.id);
        assert(restoredPng && restoredPng.fileBlob.size === pngBlob.size, 'Restored PNG Blob matches exact byte size');
        assert(restoredWebp && restoredWebp.fileBlob.size === webpBlob.size, 'Restored WEBP Blob matches exact byte size');

        // Test 10: Merge Mode Per-Conflict Resolution ('keep' vs 'replace') + New Local Preservation
        await window.ResearchMateDB.saveNotes({
          paperId: paperManual.id,
          researchProblem: 'LOCAL MODIFIED MANUAL PROBLEM'
        });
        await window.ResearchMateDB.saveNotes({
          paperId: paperWithPdf.id,
          researchObjective: 'TEMPORARY OVERWRITE TARGET'
        });
        const bertPaper = await window.ResearchMateDB.addPaper({ title: 'BERT: Pre-training Transformers', authors: 'Devlin et al.', year: 2018 });

        const reValidated = await window.ResearchMateDB.inspectAndValidateZipBackup(zipExport.blob);
        assert(reValidated.conflicts.length === 2, 'Inspector detected both conflicting paper IDs');

        await window.ResearchMateDB.restoreZipBackup(reValidated, 'merge', {
          [paperManual.id]: 'keep',
          [paperWithPdf.id]: 'replace'
        });

        const keptNote = await window.ResearchMateDB.getNotesByPaperId(paperManual.id);
        const replacedNote = await window.ResearchMateDB.getNotesByPaperId(paperWithPdf.id);
        assert(window.ResearchMateDB.extractSectionPlainText(keptNote.researchProblem).includes('LOCAL MODIFIED MANUAL PROBLEM'), 'Merge conflict resolution "keep" preserved local edits');
        assert(window.ResearchMateDB.extractSectionPlainText(replacedNote.researchObjective).includes('Eliminate recurrence completely.'), 'Merge conflict resolution "replace" overwrote with backup');
        assert((await window.ResearchMateDB.getPaperById(bertPaper.id)) !== null, 'Merge mode preserved non-conflicting local BERT paper');

        // Test 11: V1 Legacy ZIP Backup Backward-Compatibility Restore
        const v1Zip = new window.JSZip();
        v1Zip.file('backup-info.json', JSON.stringify({
          appName: 'ResearchMate',
          backupVersion: 1,
          createdAt: new Date().toISOString()
        }));
        v1Zip.file('papers.json', JSON.stringify([{
          id: 'v1_zip_paper',
          title: 'V1 Archive Paper',
          authors: 'Legacy V1',
          year: 2020,
          hasPdf: false,
          createdAt: new Date().toISOString()
        }]));
        v1Zip.file('notes.json', JSON.stringify([{
          paperId: 'v1_zip_paper',
          researchProblem: 'Legacy ZIP V1 plain text line 1\nLine 2',
          updatedAt: new Date().toISOString()
        }]));
        const v1ZipBlob = await v1Zip.generateAsync({ type: 'blob' });
        const validatedV1 = await window.ResearchMateDB.inspectAndValidateZipBackup(v1ZipBlob);
        assert(validatedV1.isValid === true && validatedV1.backupInfo.backupVersion === 1, 'V1 ZIP backup accepted & validated');
        await window.ResearchMateDB.restoreZipBackup(validatedV1, 'merge');
        const v1RestoredNote = await window.ResearchMateDB.getNotesByPaperId('v1_zip_paper');
        assert(v1RestoredNote.researchProblem.format === 'quill-delta-v1' && window.ResearchMateDB.extractSectionPlainText(v1RestoredNote.researchProblem).includes('Line 2'), 'V1 ZIP restore auto-migrated plain-text notes cleanly');

        // Test 12: Corrupted ZIP Protection
        let corruptRejected = false;
        try {
          await window.ResearchMateDB.inspectAndValidateZipBackup(new Blob(['corrupted zip payload'], { type: 'application/zip' }));
        } catch (err) {
          corruptRejected = true;
        }
        assert(corruptRejected === true, 'Corrupted ZIP backup rejected safely');
        assert((await window.ResearchMateDB.getPaperById(paperWithPdf.id)) !== null, 'Existing library unaffected after rejected corrupted ZIP');

        // Test 13: Professional V1.2 PDF Export (Vector Bengali + Images PNG/WEBP + Multi-Page Table + KaTeX Equations)
        const docDef = await window.PDFExporter.buildPdfDocumentDefinition(paperWithPdf, savedNotes);
        assert(docDef && Array.isArray(docDef.content) && docDef.defaultStyle.font === 'NotoSans', 'buildPdfDocumentDefinition constructs pdfmake document with NotoSans default');
        const flatDefJson = JSON.stringify(docDef);
        assert(flatDefJson.includes('"headerRows":1'), 'PDF document configures repeating table header (headerRows: 1)');
        assert(flatDefJson.includes('"dontBreakRows":true'), 'PDF document prevents mid-row splitting');
        assert(flatDefJson.includes('"link":"https://arxiv.org/abs/1706.03762"'), 'PDF document preserves clickable hyperlinks');
        assert(flatDefJson.includes('"font":"NotoSansBengali"'), 'PDF document applies NotoSansBengali font shaping runs');

        const pdfResult = await window.PDFExporter.exportPaperNotesAsPDF(paperWithPdf, savedNotes, { download: false });
        assert(pdfResult && pdfResult.filename.endsWith('_Review_Notes.pdf'), `PDF exporter generates sanitized filename (${pdfResult ? pdfResult.filename : 'none'})`);
        assert(pdfResult.blob instanceof Blob && pdfResult.blob.size > 15000, `PDF Blob generated cleanly (${pdfResult.blob.size} bytes)`);
        const magic = new TextDecoder().decode(await pdfResult.blob.slice(0, 5).arrayBuffer());
        assert(magic.startsWith('%PDF'), `Generated PDF starts with valid magic header (${magic})`);

        // Test 14: Cascade Paper Deletion deletes paper, notes, pdf, AND images
        await window.ResearchMateDB.deletePaper(paperWithPdf.id);
        assert((await window.ResearchMateDB.getPaperById(paperWithPdf.id)) === null, 'Deleted paper removed from papers store');
        assert((await window.ResearchMateDB.getPaperPdf(paperWithPdf.id)) === null, 'Deleted paper PDF removed from pdfs store');
        assert((await window.ResearchMateDB.getImagesByPaperId(paperWithPdf.id)).length === 0, 'Deleted paper images cascade-deleted from images store');

        // Clean up remaining test papers
        await window.ResearchMateDB.deletePaper(paperManual.id);
        await window.ResearchMateDB.deletePaper(bertPaper.id);
        await window.ResearchMateDB.deletePaper('v1_zip_paper');

        log('=== ALL V1.2 CORE, MIGRATION, BACKUP & PDF TESTS PASSED! ===', 'SUCCESS');
        document.body.setAttribute('data-test-status', 'SUCCESS');
        await fetch('/report_test_results', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'SUCCESS', results })
        }).catch(() => {});
      } catch (err) {
        console.error(err);
        log('TEST SUITE ERROR: ' + err.message, 'ERROR');
        document.body.setAttribute('data-test-status', 'ERROR');
        await fetch('/report_test_results', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'ERROR', error: err.message, results })
        }).catch(() => {});
      }
    }

    window.onload = runTests;
  </script>
</body>
</html>
