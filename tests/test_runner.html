<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ResearchMate V1.1 Automated Test Suite</title>
  <script src="../js/vendor/jszip.min.js"></script>
  <script src="../js/vendor/jspdf.umd.min.js"></script>
  <script src="../js/vendor/html2pdf.bundle.min.js"></script>
  <script src="../js/database.js"></script>
  <script src="../js/pdf-export.js"></script>
</head>
<body>
  <h1>ResearchMate V1.1 Test Runner</h1>
  <div id="testOutput" style="font-family: monospace; white-space: pre;"></div>

  <script>
    const output = document.getElementById('testOutput');
    const results = [];

    function log(msg, status = 'INFO') {
      const line = `[${status}] ${msg}`;
      output.innerText += line + '\n';
      console.log(line);
      results.push({ msg, status });
    }

    function assert(condition, testName) {
      if (condition) {
        log(`PASS: ${testName}`, 'PASS');
      } else {
        log(`FAIL: ${testName}`, 'FAIL');
        throw new Error(`Assertion failed: ${testName}`);
      }
    }

    async function runTests() {
      try {
        log('--- Starting ResearchMate V1.1 Test Suite ---');

        // Test 1: Initialize Database (V2)
        const db = await window.ResearchMateDB.initDB();
        assert(db && db.name === 'ResearchMateDB', 'IndexedDB initialized with name ResearchMateDB');
        assert(db.objectStoreNames.contains('papers'), 'Database contains "papers" store');
        assert(db.objectStoreNames.contains('notes'), 'Database contains "notes" store');
        assert(db.objectStoreNames.contains('pdfs'), 'Database contains V1.1 "pdfs" store');

        // Test 2: Validation on addPaper (missing title)
        let caughtMissingTitle = false;
        try {
          await window.ResearchMateDB.addPaper({ title: '', authors: 'Vaswani et al.' });
        } catch (e) {
          caughtMissingTitle = true;
        }
        assert(caughtMissingTitle, 'addPaper rejects missing title');

        // Test 3: Validation on addPaper (missing authors)
        let caughtMissingAuthors = false;
        try {
          await window.ResearchMateDB.addPaper({ title: 'Attention Is All You Need', authors: '' });
        } catch (e) {
          caughtMissingAuthors = true;
        }
        assert(caughtMissingAuthors, 'addPaper rejects missing authors');

        // Test 4: Option 1 - Add Paper Manually (No PDF)
        const paperManual = await window.ResearchMateDB.addPaper({
          title: 'Deep Residual Learning for Image Recognition',
          authors: 'Kaiming He, Xiangyu Zhang, Shaoqing Ren, Jian Sun',
          year: 2016,
          doiUrl: 'https://arxiv.org/abs/1512.03385'
        });
        assert(paperManual && paperManual.id, 'Paper 1 (Manual) created');
        assert(paperManual.hasPdf === false, 'Manual paper hasPdf is false');

        // Verify PDF store has NO record for manual paper
        const manualPdf = await window.ResearchMateDB.getPaperPdf(paperManual.id);
        assert(manualPdf === null, 'getPaperPdf returns null for manually added paper');

        // Test 5: Option 2 - Add Paper with Uploaded Original PDF Blob
        const fakePdfBlob = new Blob(['%PDF-1.4 Fake PDF Content for ResearchMate Test'], { type: 'application/pdf' });
        fakePdfBlob.name = 'attention_2017.pdf';

        const paperWithPdf = await window.ResearchMateDB.addPaper({
          title: 'Attention Is All You Need',
          authors: 'Ashish Vaswani, Noam Shazeer, Niki Parmar, et al.',
          year: 2017,
          doiUrl: 'https://arxiv.org/abs/1706.03762'
        }, fakePdfBlob);

        assert(paperWithPdf && paperWithPdf.id, 'Paper 2 (with PDF) created');
        assert(paperWithPdf.hasPdf === true, 'Paper 2 hasPdf is true');
        assert(paperWithPdf.pdfFileName === 'attention_2017.pdf', 'Paper 2 stores PDF filename');

        // Verify PDF store contains the binary blob
        const storedPdf = await window.ResearchMateDB.getPaperPdf(paperWithPdf.id);
        assert(storedPdf && storedPdf.fileBlob !== null, 'getPaperPdf retrieves stored PDF record');
        assert(storedPdf.fileBlob.size === fakePdfBlob.size, 'Stored PDF blob matches original size');

        // Test 6: Write notes for Paper 2 across 10 sections
        const notesContent = {
          paperId: paperWithPdf.id,
          researchProblem: 'Recurrent models generate sequences sequentially. এটি প্রধান সমস্যা।',
          researchObjective: 'Propose the Transformer architecture.',
          dataset: 'WMT 2014 English-to-German & English-to-French.',
          methodology: 'Multi-Head Self-Attention.',
          evaluationProtocol: '8 P100 GPUs, Adam optimizer.',
          evaluationMetrics: 'BLEU score 28.4.',
          keyFindings: 'State of the art translation quality.',
          limitations: 'O(n^2) sequence length complexity.',
          futureWork: 'Extend to other modalities.',
          criticalAnalysis: 'Seminal foundation for modern LLMs.'
        };
        const savedNotes = await window.ResearchMateDB.saveNotes(notesContent);
        assert(savedNotes && savedNotes.paperId === paperWithPdf.id, 'saveNotes succeeded for Paper 2');

        // Test 7: Completion statistics
        const stats = window.ResearchMateDB.calculateCompletion(savedNotes);
        assert(stats.completedCount === 10, 'Completion count is 10/10');
        assert(stats.isComplete === true, 'isComplete is true');

        // Test 8: Export Notes Only (JSON)
        const notesExport = await window.ResearchMateDB.exportNotesOnlyJson();
        assert(notesExport && notesExport.filename.endsWith('.json'), 'exportNotesOnlyJson returns .json filename');
        const parsedNotesExport = JSON.parse(notesExport.jsonString);
        assert(parsedNotesExport.appName === 'ResearchMate', 'Notes JSON has appName ResearchMate');
        assert(parsedNotesExport.exportType === 'notes-only', 'Notes JSON has exportType notes-only');
        assert(parsedNotesExport.papers.length >= 2, 'Notes JSON contains papers list');

        // Test 9: Export Full Backup (ZIP)
        let zipProgressReported = false;
        const zipExport = await window.ResearchMateDB.exportFullBackupZip((pct, msg) => {
          zipProgressReported = true;
        });
        assert(zipExport && zipExport.blob && zipExport.blob.size > 0, 'exportFullBackupZip generated non-empty ZIP Blob');
        assert(zipExport.filename.endsWith('.zip'), 'ZIP export has .zip filename');
        assert(zipProgressReported, 'ZIP progress callback was called');

        // Test 10: Inspect & Validate Exported ZIP
        const validatedZip = await window.ResearchMateDB.inspectAndValidateZipBackup(zipExport.blob);
        assert(validatedZip.isValid === true, 'ZIP backup validated as valid');
        assert(validatedZip.backupInfo.appName === 'ResearchMate', 'backup-info.json contains appName: ResearchMate');
        assert(validatedZip.papers.length >= 2, 'ZIP backup contains at least 2 papers');
        assert(validatedZip.pdfCount >= 1, 'ZIP backup contains original-pdfs entry');

        // Test 11: Restore Backup - Replace Mode
        const restoreReplaceResult = await window.ResearchMateDB.restoreZipBackup(validatedZip, 'replace');
        assert(restoreReplaceResult.restoredPapers >= 2, 'Replace mode restored all papers');
        assert(restoreReplaceResult.restoredPdfs >= 1, 'Replace mode restored all PDFs');

        // Verify PDF is intact after restore
        const restoredPdf = await window.ResearchMateDB.getPaperPdf(paperWithPdf.id);
        assert(restoredPdf && restoredPdf.fileBlob.size === fakePdfBlob.size, 'Restored PDF matches original blob size');

        // Test 12: Restore Backup - Merge Mode
        // Create another new paper in local DB
        const paperNewLocal = await window.ResearchMateDB.addPaper({
          title: 'BERT: Pre-training of Deep Bidirectional Transformers',
          authors: 'Devlin et al.',
          year: 2018
        });

        // Merge the previous backup
        const restoreMergeResult = await window.ResearchMateDB.restoreZipBackup(validatedZip, 'merge');
        // PaperNewLocal must still exist!
        const bertPaper = await window.ResearchMateDB.getPaperById(paperNewLocal.id);
        assert(bertPaper !== null && bertPaper.title.includes('BERT'), 'Merge mode preserved local paper without overwriting');

        // Test 13: Cascade deletion deletes paper, notes, AND pdf
        await window.ResearchMateDB.deletePaper(paperWithPdf.id);
        const deletedPaper = await window.ResearchMateDB.getPaperById(paperWithPdf.id);
        const deletedNotes = await window.ResearchMateDB.getNotesByPaperId(paperWithPdf.id);
        const deletedPdf = await window.ResearchMateDB.getPaperPdf(paperWithPdf.id);

        assert(deletedPaper === null, 'Paper removed from papers store');
        assert(deletedNotes.researchProblem === '', 'Notes cleared');
        assert(deletedPdf === null, 'PDF removed from pdfs store on paper deletion');

        // Clean up remaining papers
        await window.ResearchMateDB.deletePaper(paperManual.id);
        await window.ResearchMateDB.deletePaper(paperNewLocal.id);

        log('=== ALL 13 V1.1 CORE TESTS PASSED SUCCESSFULLY! ===', 'SUCCESS');
        document.body.setAttribute('data-test-status', 'SUCCESS');
        await fetch('/report_test_results', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'SUCCESS', results })
        }).catch(() => {});
      } catch (err) {
        log('TEST SUITE ERROR: ' + err.message, 'ERROR');
        document.body.setAttribute('data-test-status', 'ERROR');
        await fetch('/report_test_results', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'ERROR', error: err.message, results })
        }).catch(() => {});
      }
    }

    window.onload = runTests;
  </script>
</body>
</html>
