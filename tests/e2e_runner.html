<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ResearchMate V1.2 — End-to-End Interactive Browser Suite</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; background: #f8fafc; color: #0f172a; }
    #appFrame { width: 1200px; height: 780px; border: 2px solid #cbd5e1; border-radius: 8px; margin-bottom: 20px; background: #fff; }
    #logs { background: #1e293b; color: #f8fafc; padding: 14px; border-radius: 8px; font-family: monospace; font-size: 13px; max-height: 280px; overflow-y: auto; }
    .log-pass { color: #4ade80; }
    .log-fail { color: #f87171; font-weight: bold; }
    .log-info { color: #60a5fa; }
  </style>
</head>
<body>
  <h1>ResearchMate V1.2 — End-to-End Interactive Browser Suite</h1>
  <div id="testStatusBanner" style="padding: 10px; margin-bottom: 10px; font-weight: bold; background: #e2e8f0; border-radius: 6px;">Running V1.2 E2E Tests...</div>
  <iframe id="appFrame" src="../index.html"></iframe>
  <div id="logs"></div>

  <script>
    const results = [];
    const pageErrors = [];

    function log(msg, type = 'INFO') {
      const div = document.createElement('div');
      div.className = 'log-' + type.toLowerCase();
      div.textContent = `[${type}] ${msg}`;
      document.getElementById('logs').appendChild(div);
      results.push({ status: type, msg });
    }

    function assert(cond, msg) {
      if (!cond) {
        log(msg, 'FAIL');
        throw new Error('E2E Assertion Failed: ' + msg);
      }
      log(msg, 'PASS');
    }

    const wait = ms => new Promise(r => setTimeout(r, ms));

    async function createPngFile(name, width, height, color, text) {
      const c = document.createElement('canvas');
      c.width = width;
      c.height = height;
      const ctx = c.getContext('2d');
      ctx.fillStyle = color;
      ctx.fillRect(0, 0, width, height);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 14px sans-serif';
      ctx.fillText(text || 'Diagram', 16, Math.round(height / 2));
      const blob = await new Promise(res => c.toBlob(res, 'image/png'));
      return new File([blob], name, { type: 'image/png' });
    }

    async function runE2E() {
      try {
        const frame = document.getElementById('appFrame');
        await new Promise(resolve => {
          if (frame.contentDocument && frame.contentDocument.readyState === 'complete') {
            resolve();
          } else {
            frame.onload = resolve;
          }
        });

        await wait(600);
        const doc = frame.contentDocument;
        const win = frame.contentWindow;

        // Track any unhandled runtime errors inside the real app window
        win.addEventListener('error', (e) => {
          pageErrors.push(e.message || 'Window error');
        });
        win.addEventListener('unhandledrejection', (e) => {
          pageErrors.push((e.reason && e.reason.message) || String(e.reason || 'Unhandled rejection'));
        });

        log('App loaded in iframe. Starting V1.2 UI verification...');

        // E2E Test 1: Dashboard active initially & clean library + 390px mobile responsiveness check
        const dashboardView = doc.getElementById('dashboardSection');
        assert(dashboardView && dashboardView.classList.contains('active-view'), 'Dashboard view is active on boot');
        frame.style.width = '390px';
        await wait(120);
        assert(doc.documentElement.scrollWidth <= 390, `Mobile viewport 390px has zero horizontal overflow (scrollWidth=${doc.documentElement.scrollWidth})`);
        frame.style.width = '1200px';
        await wait(80);

        // E2E Test 2: Open Add Paper Modal & create Manual Paper ("ResNet")
        const addBtn = doc.querySelector('[data-action="open-add-paper-modal"]');
        assert(addBtn !== null, 'Found Add New Paper CTA button');
        addBtn.click();
        await wait(150);

        const modal = doc.getElementById('addPaperModal');
        assert(modal.classList.contains('active'), 'Add Paper modal opened');

        doc.getElementById('paperTitleInput').value = 'ResNet: Deep Residual Learning for Image Recognition';
        doc.getElementById('paperAuthorsInput').value = 'He et al.';
        doc.getElementById('paperYearInput').value = '2016';
        doc.getElementById('paperDoiInput').value = 'https://arxiv.org/abs/1512.03385';

        doc.getElementById('addPaperManualForm').dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
        await wait(500);

        // Verify Note Editor mounted all 10 unified rich section editors
        const notesSection = doc.getElementById('notesSection');
        assert(notesSection.classList.contains('active-view'), 'Navigated to Note Editor view automatically');
        assert(doc.getElementById('notesPaperTitle').textContent.includes('ResNet'), 'Notes banner shows ResNet title');
        const sectionCards = doc.querySelectorAll('.note-section-card');
        const richEditors = doc.querySelectorAll('.note-rich-editor-host .ql-editor');
        assert(sectionCards.length === 10 && richEditors.length === 10, 'All 10 sections mounted independent unified rich editors');

        // E2E Test 3: Unified Rich Text + Section Independence + Equation Modal + Re-edit Equation
        const rpEditor = win.NotesManager.getSectionEditor('researchProblem');
        const dsEditor = win.NotesManager.getSectionEditor('dataset');
        assert(rpEditor && dsEditor, 'Rich editor handles accessible via NotesManager');

        rpEditor.quill.setText('Gradient degradation in very deep networks (গভীর নেটওয়ার্কে সমস্যা)।\n', 'user');
        rpEditor.quill.formatLine(0, 10, 'header', 2, 'user');
        rpEditor.quill.insertEmbed(rpEditor.quill.getLength() - 1, 'hr', true, 'user');
        await wait(100);

        assert(dsEditor.quill.getText().trim() === '', 'Section independence preserved (Dataset stayed empty while editing Research Problem)');

        // Insert Inline Math via modal in Methodology section
        const methCard = doc.getElementById('section-methodology');
        const methEditor = win.NotesManager.getSectionEditor('methodology');
        methEditor.quill.setText('Residual mapping definition: ', 'user');
        methEditor.quill.setSelection(methEditor.quill.getLength() - 1, 0, 'silent');

        methCard.querySelector('.rm-tool-math').click();
        await wait(120);
        const mathModal = doc.getElementById('mathEditorModal');
        assert(mathModal.classList.contains('active'), 'Math Equation modal opened via toolbar button');

        const latexInput = doc.getElementById('mathLatexInput');
        latexInput.value = 'y = F(x) + x';
        latexInput.dispatchEvent(new Event('input', { bubbles: true }));
        await wait(80);
        assert(doc.querySelector('#mathLivePreview .katex') !== null, 'Math modal live-preview rendered KaTeX equation');
        doc.getElementById('applyMathBtn').click();
        await wait(120);

        const insertedMathEl = methCard.querySelector('.rm-math-embed');
        assert(insertedMathEl !== null && insertedMathEl.querySelector('.katex') !== null, 'Inline KaTeX equation inserted inside Methodology editor');

        // Click existing equation to reopen modal and edit raw LaTeX -> switch to block equation
        insertedMathEl.click();
        await wait(120);
        assert(mathModal.classList.contains('active'), 'Clicking rendered equation reopens Math modal');
        assert(latexInput.value === 'y = F(x) + x', 'Reopened Math modal preserved raw LaTeX source');
        mathModal.querySelector('input[name="mathDisplayMode"][value="block"]').checked = true;
        latexInput.value = '\\mathcal{F}(x) = \\mathcal{H}(x) - x';
        doc.getElementById('applyMathBtn').click();
        await wait(120);
        assert(methCard.querySelector('.rm-math-embed.rm-math-block .katex') !== null, 'Edited equation switched to display/block KaTeX mode cleanly');

        // E2E Test 4: Insert Comparison Table + Structural Row/Col Editing
        methCard.querySelector('.rm-tool-table').click();
        await wait(120);
        const tableModal = doc.getElementById('insertTableModal');
        assert(tableModal.classList.contains('active'), 'Insert Table modal opened');
        doc.getElementById('tableRowsInput').value = '2';
        doc.getElementById('tableColsInput').value = '2';
        doc.getElementById('tableHeaderToggle').checked = true;
        doc.getElementById('applyTableInsertBtn').click();
        await wait(150);

        assert(methCard.querySelectorAll('.rm-editor-table tr').length === 2, 'Inserted 2x2 interactive table inside Methodology');
        const tableBtns = Array.from(methCard.querySelectorAll('.rm-table-btn'));
        tableBtns.find(b => b.textContent.trim() === '+ Row').click();
        await wait(80);
        Array.from(methCard.querySelectorAll('.rm-table-btn')).find(b => b.textContent.trim() === '+ Col').click();
        await wait(80);
        assert(methCard.querySelectorAll('.rm-editor-table tr').length === 3, 'Table "+ Row" increased rows to 3');
        assert(methCard.querySelectorAll('.rm-editor-table tr:first-child th, .rm-editor-table tr:first-child td').length === 3, 'Table "+ Col" increased columns to 3');

        // Type inside cell & confirm editor text didn't break
        const targetCell = methCard.querySelector('.rm-table-cell-edit[data-row="1"][data-col="0"]');
        targetCell.innerHTML = '<b>ResNet-50</b>';
        targetCell.dispatchEvent(new Event('input', { bubbles: true }));
        await wait(80);

        // E2E Test 5: Drag-and-drop PNG Image + Caption/Source + Resize/Align + Autosave
        const pngFile = await createPngFile('resnet_block.png', 220, 130, '#0f766e', 'Residual Block');
        const dtImg = new DataTransfer();
        dtImg.items.add(pngFile);
        const methQuillRoot = methCard.querySelector('.ql-editor');
        const dropEvt = new win.Event('drop', { bubbles: true, cancelable: true });
        Object.defineProperty(dropEvt, 'dataTransfer', { value: dtImg });
        methQuillRoot.dispatchEvent(dropEvt);
        await wait(500);

        const figEl = methCard.querySelector('figure.rm-figure');
        assert(figEl !== null, 'Dropped PNG inserted unified figure inside Methodology');
        const figImg = figEl.querySelector('img');
        assert(figImg && figImg.getAttribute('src') && figImg.getAttribute('src').startsWith('blob:'), 'Inserted image renders from IndexedDB via blob: URL (not data:image/ base64)');

        // Resize to M (60%) & Align Left
        const figBtns = Array.from(figEl.querySelectorAll('.rm-fig-btn'));
        figBtns.find(b => b.textContent.trim() === 'M').click();
        await wait(80);
        Array.from(methCard.querySelectorAll('figure.rm-figure .rm-fig-btn')).find(b => b.textContent.trim() === 'Left').click();
        await wait(80);
        assert(methCard.querySelector('figure.rm-figure').classList.contains('align-left'), 'Figure alignment updated to Left');

        // Open Image Caption & Source modal
        Array.from(methCard.querySelectorAll('figure.rm-figure .rm-fig-btn')).find(b => b.textContent.includes('Caption')).click();
        await wait(120);
        const imgMetaModal = doc.getElementById('imageMetaModal');
        assert(imgMetaModal.classList.contains('active'), 'Image Caption & Source modal opened');
        doc.getElementById('imageCaptionInput').value = 'Fig. 1: Residual Skip Connection';
        doc.getElementById('imageSourceInput').value = 'He et al. (2016)';
        doc.getElementById('applyImageMetaBtn').click();
        await wait(150);
        assert(methCard.textContent.includes('Fig. 1: Residual Skip Connection'), 'Figure caption displayed inside unified editor');

        // Verify Debounced Autosave runs and updates indicator to Saved
        assert(doc.getElementById('notesSaveStatusText') !== null, 'Save status badge present');
        await wait(1600);
        const savedStatusText = doc.getElementById('notesSaveStatusText').textContent;
        assert(savedStatusText.startsWith('Saved'), `Debounced autosave completed (${savedStatusText})`);

        // E2E Test 6: Preview Mode renders rich text, hydrated image, table, KaTeX + PDF Export works
        doc.getElementById('toggleNotesModeBtn').click();
        await wait(350);
        const readWrap = doc.getElementById('notesReadOnlyWrapper');
        const readContent = doc.getElementById('notesReadOnlyContent');
        assert(readWrap.style.display === 'block', 'Switched to Read-Only Preview Mode');
        assert(readContent.querySelector('.katex') !== null, 'Preview Mode rendered KaTeX math');
        assert(readContent.querySelector('table tr') !== null && readContent.textContent.includes('ResNet-50'), 'Preview Mode rendered formatted table content');
        const previewImg = readContent.querySelector('img');
        assert(previewImg && previewImg.getAttribute('src') && previewImg.getAttribute('src').startsWith('blob:'), 'Preview Mode hydrated IndexedDB figure image via blob URL');

        // Verify PDF export for active note produces real %PDF blob cleanly
        const exportedPdf = await win.PDFExporter.exportPaperNotesAsPDF(
          win.NotesManager.getCurrentPaper(),
          win.NotesManager.getCurrentNotes(),
          { download: false }
        );
        assert(exportedPdf.blob instanceof win.Blob && exportedPdf.blob.size > 10000, `Live UI note exported to PDF (${exportedPdf.blob.size} bytes)`);

        // Also click the toolbar Download PDF button to ensure zero runtime errors
        doc.getElementById('notesDownloadPdfBtn').click();
        await wait(700);

        // E2E Test 7: Upload Original Research Paper PDF Tab & Badges
        const navPapers = doc.querySelector('[data-nav="papers"]');
        navPapers.click();
        await wait(300);
        doc.querySelector('#papersSection [data-action="open-add-paper-modal"]').click();
        await wait(150);

        doc.getElementById('tabAddUploadBtn').click();
        await wait(100);
        const fakePdf = new File(['%PDF-1.4\n1 0 obj\n<< /Title (Transformer) >>\nendobj\n%%EOF'], 'transformer_paper.pdf', { type: 'application/pdf' });
        const dtPdf = new DataTransfer();
        dtPdf.items.add(fakePdf);
        const pdfInput = doc.getElementById('paperPdfFileInput');
        pdfInput.files = dtPdf.files;
        pdfInput.dispatchEvent(new Event('change', { bubbles: true }));
        await wait(250);
        assert(doc.getElementById('selectedPdfInfoBox').style.display === 'flex', 'Selected PDF info box displayed');

        doc.getElementById('uploadPaperTitle').value = 'Attention Is All You Need';
        doc.getElementById('uploadPaperAuthors').value = 'Vaswani et al.';
        doc.getElementById('uploadPaperYear').value = '2017';
        doc.getElementById('addPaperUploadForm').dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
        await wait(500);
        assert(doc.getElementById('notesPaperPdfWrap').style.display === 'inline-flex', 'View Original PDF button displayed for PDF-backed paper');

        navPapers.click();
        await wait(300);
        const cards = Array.from(doc.querySelectorAll('#papersListContainer .paper-card'));
        assert(cards.length === 2, 'My Papers displays 2 papers');
        const resnetCard = cards.find(c => c.textContent.includes('ResNet'));
        assert(resnetCard.textContent.includes('2 / 10') || resnetCard.textContent.includes('2/10'), 'My Papers progress reflects saved rich sections');

        // E2E Test 8: Data Management Invalid ZIP Error UI + V2 Backup & Merge Conflict Selector UI
        doc.querySelector('[data-nav="data"]').click();
        await wait(300);
        assert(doc.getElementById('dataSection').classList.contains('active-view'), 'Data Management section is active');

        const corruptZip = new File(['not a zip'], 'corrupt.zip', { type: 'application/zip' });
        const dtCorrupt = new DataTransfer();
        dtCorrupt.items.add(corruptZip);
        const restoreInput = doc.getElementById('restoreZipFileInput');
        restoreInput.files = dtCorrupt.files;
        restoreInput.dispatchEvent(new Event('change', { bubbles: true }));
        await wait(300);
        assert(doc.getElementById('restoreZipError').style.display === 'block', 'Corrupted ZIP displays visible error alert in UI');

        doc.getElementById('exportNotesJsonBtn').click();
        await wait(150);

        const liveZip = await win.ResearchMateDB.exportFullBackupZip();
        const zipFile = new File([liveZip.blob], liveZip.filename, { type: 'application/zip' });
        const dtZip = new DataTransfer();
        dtZip.items.add(zipFile);
        restoreInput.files = dtZip.files;
        restoreInput.dispatchEvent(new Event('change', { bubbles: true }));
        await wait(600);

        assert(doc.getElementById('restoreZipPreviewBox').style.display === 'block', 'Staged V2 ZIP preview displayed');
        assert(doc.getElementById('restoreBackupMetaSummary').textContent.includes('1 Embedded Images'), 'Backup summary shows Embedded Images count');
        const conflictSelects = doc.querySelectorAll('#restoreConflictsList .conflict-resolution-select');
        assert(conflictSelects.length === 2, 'Merge conflict UI rendered per-paper resolution selectors');
        conflictSelects[0].value = 'replace';
        doc.querySelector('input[name="restoreMode"][value="merge"]').checked = true;
        doc.getElementById('executeRestoreBtn').click();
        await wait(700);

        // E2E Test 9: Clean up all papers and confirm zero page/console exceptions
        navPapers.click();
        await wait(300);
        const delBtns = doc.querySelectorAll('#papersListContainer [data-action="delete-paper"]');
        for (const btn of delBtns) {
          btn.click();
          await wait(100);
          doc.getElementById('confirmDeleteBtn').click();
          await wait(300);
        }
        assert(doc.querySelectorAll('#papersListContainer .paper-card').length === 0, 'All papers cleanly deleted');
        assert(pageErrors.length === 0, `Zero uncaught runtime errors during E2E workflow (got ${pageErrors.length}: ${pageErrors.join('; ')})`);

        log('=== ALL V1.2 E2E UI TESTS PASSED! ===', 'SUCCESS');
        document.getElementById('testStatusBanner').innerText = 'ALL V1.2 E2E UI TESTS PASSED!';

        await fetch('/report_test_results', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'SUCCESS', results })
        }).catch(() => {});
      } catch (err) {
        log('E2E ERROR: ' + err.message, 'ERROR');
        document.getElementById('testStatusBanner').innerText = 'ERROR: ' + err.message;
        await fetch('/report_test_results', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'ERROR', error: err.message, results })
        }).catch(() => {});
      }
    }

    window.onload = runE2E;
  </script>
</body>
</html>
