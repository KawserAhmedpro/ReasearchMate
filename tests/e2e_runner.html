<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ResearchMate V1.1 End-to-End UI Test Suite</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/vendor/jszip.min.js"></script>
  <script src="../js/vendor/jspdf.umd.min.js"></script>
  <script src="../js/vendor/html2pdf.bundle.min.js"></script>
</head>
<body>
  <div id="testStatusBanner" style="padding: 10px; background: #e0f2fe; font-family: monospace;">Running V1.1 E2E tests...</div>
  <iframe id="appFrame" src="../index.html" style="width: 100%; height: 900px; border: 1px solid #ccc;"></iframe>

  <script>
    const results = [];

    function log(msg, status = 'INFO') {
      const line = `[${status}] ${msg}`;
      console.log(line);
      results.push({ msg, status });
    }

    function assert(cond, name) {
      if (cond) {
        log(`PASS: ${name}`, 'PASS');
      } else {
        log(`FAIL: ${name}`, 'FAIL');
        throw new Error(`Assertion failed: ${name}`);
      }
    }

    const wait = ms => new Promise(r => setTimeout(r, ms));

    async function runE2E() {
      try {
        log('Starting ResearchMate V1.1 E2E UI Testing...');
        const iframe = document.getElementById('appFrame');

        await new Promise(r => {
          if (iframe.contentDocument && iframe.contentDocument.readyState === 'complete') r();
          else iframe.onload = r;
        });

        const doc = iframe.contentDocument;
        const win = iframe.contentWindow;

        await wait(500);

        // UI Test 1: Verify Initial Dashboard State
        assert(doc.getElementById('dashboardSection').classList.contains('active-view'), 'Dashboard is active on initial load');
        assert(doc.getElementById('statTotalPapers').textContent === '0', 'Initial total papers count is 0');
        assert(doc.getElementById('statPdfCount').textContent === '0', 'Initial PDF count is 0');

        // UI Test 2: Open Add Paper Modal
        const openModalBtn = doc.querySelector('[data-action="open-add-paper-modal"]');
        assert(openModalBtn !== null, 'Found Add Paper button');
        openModalBtn.click();
        await wait(100);

        const addModal = doc.getElementById('addPaperModal');
        assert(addModal.classList.contains('active'), 'Add Paper Modal is open');

        // UI Test 3: Test Option 1 (Manual Entry)
        const tabManualBtn = doc.getElementById('tabAddManualBtn');
        assert(tabManualBtn !== null, 'Found Manual Entry tab button');
        tabManualBtn.click();
        await wait(50);

        const titleInput = doc.getElementById('paperTitleInput');
        const authorsInput = doc.getElementById('paperAuthorsInput');
        const yearInput = doc.getElementById('paperYearInput');
        const manualForm = doc.getElementById('addPaperManualForm');

        titleInput.value = 'ResNet: Deep Residual Learning';
        authorsInput.value = 'He et al.';
        yearInput.value = '2016';
        manualForm.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
        await wait(600);

        // Should navigate to note editor
        assert(doc.getElementById('notesSection').classList.contains('active-view'), 'Navigated to Note Editor for manual paper');
        assert(doc.getElementById('notesPaperTitle').textContent === 'ResNet: Deep Residual Learning', 'Paper title in Note Editor');
        assert(doc.getElementById('notesPaperPdfWrap').style.display === 'none', 'View Original PDF button hidden for manual paper');

        // UI Test 4: Open Add Paper Modal and switch to Option 2 (Upload PDF)
        openModalBtn.click();
        await wait(100);

        const tabUploadBtn = doc.getElementById('tabAddUploadBtn');
        assert(tabUploadBtn !== null, 'Found Upload PDF tab button');
        tabUploadBtn.click();
        await wait(50);
        assert(doc.getElementById('addUploadTabContent').style.display === 'block', 'Upload tab content is visible');

        // Simulate file selection
        const fakeFile = new File(['%PDF-1.4 Mock PDF Stream Content'], 'transformer_paper.pdf', { type: 'application/pdf' });
        const fileInput = doc.getElementById('paperPdfFileInput');

        // We can simulate selecting file via DataTransfer
        const dt = new DataTransfer();
        dt.items.add(fakeFile);
        fileInput.files = dt.files;
        fileInput.dispatchEvent(new Event('change', { bubbles: true }));
        await wait(200);

        // Verify selected file info box displays filename and size
        assert(doc.getElementById('selectedPdfInfoBox').style.display === 'flex', 'Selected PDF info box is displayed');
        assert(doc.getElementById('selectedPdfFileName').textContent === 'transformer_paper.pdf', 'Selected PDF filename displayed');

        // Fill metadata
        const uploadTitleInput = doc.getElementById('uploadPaperTitle');
        const uploadAuthorsInput = doc.getElementById('uploadPaperAuthors');
        const uploadYearInput = doc.getElementById('uploadPaperYear');
        const uploadForm = doc.getElementById('addPaperUploadForm');

        uploadTitleInput.value = 'Attention Is All You Need';
        uploadAuthorsInput.value = 'Vaswani et al.';
        uploadYearInput.value = '2017';

        uploadForm.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
        await wait(600);

        // Verify navigation to Note Editor and presence of "View Original PDF" in banner
        assert(doc.getElementById('notesSection').classList.contains('active-view'), 'Navigated to Note Editor for uploaded PDF paper');
        assert(doc.getElementById('notesPaperTitle').textContent === 'Attention Is All You Need', 'Paper title matches uploaded paper');
        assert(doc.getElementById('notesPaperPdfWrap').style.display === 'inline-flex', 'View Original PDF button displayed in banner');

        // UI Test 5: Navigate to My Papers and verify cards
        const myPapersNav = doc.querySelector('[data-nav="papers"]');
        myPapersNav.click();
        await wait(300);

        const paperCards = doc.querySelectorAll('#papersListContainer .paper-card');
        assert(paperCards.length === 2, 'My Papers displays 2 papers');

        // Paper with PDF must have "PDF Attached" badge and "View Original PDF" button
        const cardWithPdf = Array.from(paperCards).find(c => c.textContent.includes('Attention Is All You Need'));
        assert(cardWithPdf.querySelector('.badge-pdf') !== null, 'Card with PDF displays PDF Attached badge');
        assert(cardWithPdf.querySelector('[data-action="view-original-pdf"]') !== null, 'Card with PDF displays View Original PDF button');

        // Paper without PDF must NOT have View Original PDF button
        const cardWithoutPdf = Array.from(paperCards).find(c => c.textContent.includes('ResNet'));
        assert(cardWithoutPdf.querySelector('.badge-pdf') === null, 'Card without PDF has no PDF Attached badge');
        assert(cardWithoutPdf.querySelector('[data-action="view-original-pdf"]') === null, 'Card without PDF has no View Original PDF button');

        // UI Test 6: Navigate to Data Management
        const dataNav = doc.querySelector('[data-nav="data"]');
        assert(dataNav !== null, 'Data Management navigation link exists');
        dataNav.click();
        await wait(300);

        assert(doc.getElementById('dataSection').classList.contains('active-view'), 'Data Management section is active');
        assert(doc.getElementById('exportFullZipBtn') !== null, 'Export Full Backup (.ZIP) button exists');
        assert(doc.getElementById('exportNotesJsonBtn') !== null, 'Export Notes Only (.JSON) button exists');
        assert(doc.getElementById('restoreZipDropzone') !== null, 'Restore ZIP dropzone exists');

        // UI Test 7: Export Notes Only JSON click
        doc.getElementById('exportNotesJsonBtn').click();
        await wait(200);

        // Clean up: delete the test papers
        myPapersNav.click();
        await wait(200);

        const deleteBtns = doc.querySelectorAll('#papersListContainer [data-action="delete-paper"]');
        for (const btn of deleteBtns) {
          btn.click();
          await wait(100);
          const confirmBtn = doc.getElementById('confirmDeleteBtn');
          confirmBtn.click();
          await wait(300);
        }

        assert(doc.querySelectorAll('#papersListContainer .paper-card').length === 0, 'All papers cleanly deleted');

        log('=== ALL V1.1 E2E UI TESTS PASSED! ===', 'SUCCESS');
        document.getElementById('testStatusBanner').innerText = 'ALL V1.1 E2E UI TESTS PASSED!';

        await fetch('/report_test_results', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'SUCCESS', results })
        }).catch(() => {});
      } catch (err) {
        log('E2E ERROR: ' + err.message, 'ERROR');
        document.getElementById('testStatusBanner').innerText = 'ERROR: ' + err.message;
        await fetch('/report_test_results', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'ERROR', error: err.message, results })
        }).catch(() => {});
      }
    }

    window.onload = runE2E;
  </script>
</body>
</html>
