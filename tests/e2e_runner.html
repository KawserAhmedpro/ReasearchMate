<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ResearchMate End-to-End UI Test Suite</title>
  <!-- Load same CSS and scripts as index.html -->
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/vendor/jspdf.umd.min.js"></script>
  <script src="../js/vendor/html2pdf.bundle.min.js"></script>
</head>
<body>
  <div id="testStatusBanner" style="padding: 10px; background: #e0f2fe; font-family: monospace;">Running E2E tests...</div>
  <!-- We will load index.html content inside an iframe to test exact user interactions -->
  <iframe id="appFrame" src="../index.html" style="width: 100%; height: 900px; border: 1px solid #ccc;"></iframe>

  <script>
    const results = [];

    function log(msg, status = 'INFO') {
      const line = `[${status}] ${msg}`;
      console.log(line);
      results.push({ msg, status });
    }

    function assert(cond, name) {
      if (cond) {
        log(`PASS: ${name}`, 'PASS');
      } else {
        log(`FAIL: ${name}`, 'FAIL');
        throw new Error(`Assertion failed: ${name}`);
      }
    }

    const wait = ms => new Promise(r => setTimeout(r, ms));

    async function runE2E() {
      try {
        log('Starting End-to-End UI Testing...');
        const iframe = document.getElementById('appFrame');

        // Wait for iframe to load
        await new Promise(r => {
          if (iframe.contentDocument && iframe.contentDocument.readyState === 'complete') r();
          else iframe.onload = r;
        });

        const doc = iframe.contentDocument;
        const win = iframe.contentWindow;

        // Allow app.js and database init
        await wait(500);

        // UI Test 1: Verify Dashboard Initial State
        assert(doc.getElementById('dashboardSection').classList.contains('active-view'), 'Dashboard is active on initial load');
        assert(doc.getElementById('statTotalPapers').textContent === '0', 'Initial total papers count is 0');

        // UI Test 2: Open Add Paper Modal
        const openModalBtn = doc.querySelector('[data-action="open-add-paper-modal"]');
        assert(openModalBtn !== null, 'Found Add Paper button');
        openModalBtn.click();
        await wait(100);

        const addModal = doc.getElementById('addPaperModal');
        assert(addModal.classList.contains('active'), 'Add Paper Modal is open and visible');

        // UI Test 3: Fill and submit Add Paper Form
        const titleInput = doc.getElementById('paperTitleInput');
        const authorsInput = doc.getElementById('paperAuthorsInput');
        const yearInput = doc.getElementById('paperYearInput');
        const doiInput = doc.getElementById('paperDoiInput');
        const form = doc.getElementById('addPaperForm');

        titleInput.value = 'Attention Is All You Need';
        authorsInput.value = 'Vaswani et al.';
        yearInput.value = '2017';
        doiInput.value = 'https://arxiv.org/abs/1706.03762';

        form.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
        await wait(600);

        // UI Test 4: Verify navigation directly to Note Editor
        assert(doc.getElementById('notesSection').classList.contains('active-view'), 'Automatically navigated to Note Editor for new paper');
        assert(doc.getElementById('notesPaperTitle').textContent === 'Attention Is All You Need', 'Paper title displayed in Note Editor');
        assert(doc.getElementById('notesPaperAuthors').textContent === 'Vaswani et al.', 'Paper authors displayed in Note Editor');
        assert(doc.getElementById('notesPaperYear').textContent.includes('2017'), 'Paper year displayed in Note Editor');

        // UI Test 5: Verify all 10 Note Section textareas exist and write notes
        const sectionIds = [
          'researchProblem', 'researchObjective', 'dataset', 'methodology',
          'evaluationProtocol', 'evaluationMetrics', 'keyFindings', 'limitations',
          'futureWork', 'criticalAnalysis'
        ];

        for (let i = 0; i < sectionIds.length; i++) {
          const sec = sectionIds[i];
          const ta = doc.getElementById(`input-${sec}`);
          assert(ta !== null, `Textarea for section ${sec} exists`);
          ta.value = `Note content for section ${sec}: Tested successfully.`;
          ta.dispatchEvent(new Event('input', { bubbles: true }));
        }

        // Check unsaved indicator
        assert(doc.getElementById('notesSaveStatusText').textContent.includes('Unsaved'), 'Status indicates unsaved changes after typing');

        // UI Test 6: Save Notes
        const saveBtn = doc.getElementById('saveNotesBtn');
        saveBtn.click();
        await wait(600);

        assert(doc.getElementById('notesSaveStatusText').textContent.includes('saved'), 'Status indicates all changes saved');
        assert(doc.getElementById('notesCompletionBadge').textContent.includes('10/10'), 'Completion badge shows 10/10 Sections Completed');

        // UI Test 7: Toggle to Preview Mode and back to Editor
        const toggleBtn = doc.getElementById('toggleNotesModeBtn');
        toggleBtn.click();
        await wait(100);
        assert(doc.getElementById('notesReadOnlyWrapper').style.display === 'block', 'Preview mode displays formatted read-only view');
        assert(doc.getElementById('notesEditorWrapper').style.display === 'none', 'Editor wrapper is hidden in preview mode');

        toggleBtn.click();
        await wait(100);
        assert(doc.getElementById('notesEditorWrapper').style.display === 'block', 'Editor wrapper restored');

        // UI Test 8: Navigate to My Papers
        const myPapersNav = doc.querySelector('[data-nav="papers"]');
        myPapersNav.click();
        await wait(500);

        assert(doc.getElementById('papersSection').classList.contains('active-view'), 'My Papers view is active');
        const container = doc.getElementById('papersListContainer');
        log(`DEBUG: papersListContainer innerHTML length: ${container ? container.innerHTML.length : -1}`);
        const paperCards = doc.querySelectorAll('#papersListContainer .paper-card');
        log(`DEBUG: paperCards count: ${paperCards.length}`);
        assert(paperCards.length === 1, 'Exactly 1 paper card displayed in My Papers');
        assert(paperCards[0].textContent.includes('Attention Is All You Need'), 'Paper card displays correct title');
        assert(paperCards[0].textContent.includes('10/10 Complete'), 'Paper card displays 10/10 Complete badge');

        // UI Test 9: Test Search & Filtering in My Papers
        const searchInput = doc.getElementById('papersSearchInput');
        // Search by author
        searchInput.value = 'Vaswani';
        searchInput.dispatchEvent(new Event('input', { bubbles: true }));
        await wait(100);
        assert(doc.querySelectorAll('#papersListContainer .paper-card').length === 1, 'Search by author finds paper');

        // Search by unmatched term
        searchInput.value = 'NonExistentTitle12345';
        searchInput.dispatchEvent(new Event('input', { bubbles: true }));
        await wait(100);
        assert(doc.querySelectorAll('#papersListContainer .paper-card').length === 0, 'Unmatched search hides paper card in My Papers');
        assert(doc.getElementById('papersNoResultsState').style.display === 'block', 'No results empty state displayed');

        // Clear search
        const clearBtn = doc.getElementById('clearSearchBtn');
        clearBtn.click();
        await wait(100);
        assert(doc.querySelectorAll('#papersListContainer .paper-card').length === 1, 'Clearing search restores paper card');

        // UI Test 10: Check Dashboard stats updated
        const dashboardNav = doc.querySelector('[data-nav="dashboard"]');
        dashboardNav.click();
        await wait(200);
        assert(doc.getElementById('statTotalPapers').textContent === '1', 'Dashboard shows 1 total paper');
        assert(doc.getElementById('statCompletedNotes').textContent === '1', 'Dashboard shows 1 completed review');

        // UI Test 11: Delete Paper with confirmation
        myPapersNav.click();
        await wait(200);

        const deleteBtn = doc.querySelector('#papersListContainer [data-action="delete-paper"]');
        assert(deleteBtn !== null, 'Found delete button on paper card');
        deleteBtn.click();
        await wait(100);

        const deleteModal = doc.getElementById('deleteConfirmModal');
        assert(deleteModal.classList.contains('active'), 'Delete Confirmation Modal is displayed');
        assert(doc.getElementById('deletePaperTitlePreview').textContent.includes('Attention Is All You Need'), 'Confirmation modal displays correct paper title');

        const confirmDeleteBtn = doc.getElementById('confirmDeleteBtn');
        confirmDeleteBtn.click();
        await wait(600);

        // Verify paper is deleted
        assert(doc.querySelectorAll('#papersListContainer .paper-card').length === 0, 'Paper card removed after deletion');
        assert(doc.getElementById('papersEmptyState').style.display === 'block', 'Empty state displayed after deletion');

        // Check Dashboard reflects 0 papers
        dashboardNav.click();
        await wait(200);
        assert(doc.getElementById('statTotalPapers').textContent === '0', 'Dashboard stats reset to 0');

        log('=== ALL E2E UI TESTS PASSED! ===', 'SUCCESS');
        document.getElementById('testStatusBanner').innerText = 'ALL E2E UI TESTS PASSED!';

        await fetch('/report_test_results', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'SUCCESS', results })
        }).catch(() => {});
      } catch (err) {
        log('E2E ERROR: ' + err.message, 'ERROR');
        document.getElementById('testStatusBanner').innerText = 'ERROR: ' + err.message;
        await fetch('/report_test_results', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'ERROR', error: err.message, results })
        }).catch(() => {});
      }
    }

    window.onload = runE2E;
  </script>
</body>
</html>
